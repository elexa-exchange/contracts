[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test/foundry"
cache_path = "forge-cache"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
ffi = false

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fuzz]
runs = 256
